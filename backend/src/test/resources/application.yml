# Configuracion SOLO para las pruebas: reemplaza a src/main/resources/application.yml.
# No define spring.data.mongodb.uri, asi Spring usa el MongoDB embebido de flapdoodle
# y nunca toca Atlas ni la base local.
spring:
  data:
    mongodb:
      auto-index-creation: true

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.4
# Las pruebas crean sus propios datos: no se cargan los de ejemplo.
smartflet:
  datos-iniciales: false
