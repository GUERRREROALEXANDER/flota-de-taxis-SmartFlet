spring:
  application:
    name: smartflet-backend

  # Base de datos H2 en memoria: se crea al arrancar y se borra al detener la app.
  datasource:
    url: jdbc:h2:mem:smartflet
    username: sa
    password:

  jpa:
    hibernate:
      # Hibernate crea y actualiza las tablas a partir de las entidades.
      ddl-auto: update
    open-in-view: false

  # Consola web para ver las tablas: http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:mem:smartflet, usuario: sa, sin contrasena)
  h2:
    console:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
